<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4a6fa5">
    <meta name="description" content="Bilingual book summaries in English and Arabic">
    <link rel="manifest" href="manifest.json">
    <title>BookBites - Book Summaries</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container" id="signin-page">
        <div class="logo">
            <h1>BookBites</h1>
            <p>Your Gateway to Book Summaries</p>
        </div>
        
        <div class="auth-form">
            <h2>Sign In</h2>
            <form id="signin-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>
            
            <div class="auth-options">
                <button id="guest-btn" class="btn btn-secondary">
                    <i class="fas fa-user-secret"></i> Continue as Guest
                </button>
                <button id="signup-toggle" class="btn btn-link">Don't have an account? Sign Up</button>
            </div>
            
            <div class="social-media">
                <a href="https://www.instagram.com/book_bitess/?next=%2Faccounts%2Fpassword%2Freset%2F%3Fhl%3Den&hl=en" target="_blank">
                    <i class="fab fa-instagram"></i>
                </a>
                <p>Contact us on Instagram</p>
            </div>
        </div>
    </div>

    <script src="js/book-data.js"></script>
    <script src="js/book-data-2.js"></script>
    <script src="js/book-data-3.js"></script>
    <script src="js/book-data-4.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
